# Personal Windows test builds only.
#
# - No GitHub Release, no releases.json update, no signing certificate.
# - Produces a portable ZIP that runs after extraction (data in UserData
#   beside the exe).
#
# Started by hand (Actions → Build Windows Portable Test → Run workflow).
name: Build Windows Portable Test

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-portable-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-portable:
    name: Windows x64 Portable ZIP
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Toolchain and version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          grep -E '^FLUTTER_VERSION=' toolchain.env >> "$GITHUB_ENV"
          version=$(sed -n 's/^version: \([0-9.]*\)+\([0-9]*\)$/\1/p' apps/pure_live/pubspec.yaml)
          build=$(sed -n 's/^version: \([0-9.]*\)+\([0-9]*\)$/\2/p' apps/pure_live/pubspec.yaml)
          test -n "$version" && test -n "$build"
          echo "version=$version-$build" >> "$GITHUB_OUTPUT"
          echo "artifact=PureLive-$version-$build-windows-x64-portable.zip" >> "$GITHUB_OUTPUT"

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve packages
        shell: bash
        run: |
          set -euo pipefail
          flutter --version
          flutter pub get --enforce-lockfile

      # The recorder's FFmpeg bundle: the app's build hook reads it from
      # .ffmpeg_kit/ (Z01.2). The download cache lives outside the checkout.
      - name: Native FFmpeg bundle
        shell: pwsh
        run: pwsh -NoProfile -File tools/ffmpeg_kit/fetch.ps1 windows

      - name: Build Windows release
        working-directory: apps/pure_live
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          flutter build windows --release
          if ($LASTEXITCODE -ne 0) { throw 'flutter build windows failed' }

      - name: Pack portable ZIP
        shell: pwsh
        env:
          ARTIFACT: ${{ steps.version.outputs.artifact }}
        run: |
          $ErrorActionPreference = 'Stop'
          $bundle = 'apps/pure_live/build/windows/x64/runner/Release'
          if (!(Test-Path "$bundle/pure_live.exe" -PathType Leaf)) {
            throw "Windows release bundle not found: $bundle"
          }
          if (!(Test-Path "$bundle/data/flutter_assets" -PathType Container)) {
            throw 'Flutter assets are missing from the Windows bundle.'
          }
          foreach ($dll in @('msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll')) {
            if (!(Test-Path "$bundle/$dll" -PathType Leaf)) {
              throw "The MSVC runtime $dll is missing from the Windows bundle."
            }
          }

          $stage = Join-Path $env:RUNNER_TEMP 'pure-live-windows-portable'
          Remove-Item -Recurse -Force $stage -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $stage | Out-Null

          # A clean copy: no runtime state from a test run. 4.x/5.x keep data
          # in UserData; AppData and IPTV_CACHE are older leftovers.
          Get-ChildItem $bundle -Force |
            Where-Object { $_.Name -notin @('UserData', 'AppData', 'IPTV_CACHE') } |
            Copy-Item -Destination $stage -Recurse -Force

          $zip = $env:ARTIFACT
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $zip -CompressionLevel Optimal -Force

          $entries = tar -tf $zip
          if ($LASTEXITCODE -ne 0) { throw 'The portable ZIP could not be listed.' }
          if (!($entries | Where-Object { $_ -match '(^|/)pure_live\.exe$' })) {
            throw 'The portable ZIP has no pure_live.exe at its root.'
          }
          if ($entries | Where-Object { $_ -match '(^|/)(UserData|AppData|IPTV_CACHE)(/|$)' }) {
            throw 'Runtime state was found in the portable ZIP.'
          }
          if (!($entries | Where-Object { $_ -match '(^|/)libmpv-2\.dll$' })) {
            throw 'libmpv-2.dll is missing from the portable ZIP.'
          }

          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          $line = "$hash  $(Split-Path $zip -Leaf)`n"
          [IO.File]::WriteAllText(
            (Join-Path (Get-Location) 'SHA256SUM-windows.txt'),
            $line,
            [Text.Encoding]::ASCII
          )

      - name: Upload portable test package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.version.outputs.version }}-windows-x64-portable
          path: |
            ${{ steps.version.outputs.artifact }}
            SHA256SUM-windows.txt
          if-no-files-found: error
          retention-days: 14
