# Tests on GitHub's Ubuntu runner: local machines may not have Flutter.
#
# The quick steps cover the areas this change touches (the settings defaults
# audit, i18n, backups and the wide room's layouts); the last step runs the
# repository gate (format, dependency direction, docs, owners, analyze and
# every test) exactly as before a push.
name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Gate
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Toolchain
        run: |
          set -euo pipefail
          grep -E '^FLUTTER_(VERSION|REVISION)=' toolchain.env >> "$GITHUB_ENV"
          python3 --version

      # The build hook places packages/live_player/build/native_assets/linux/
      # libmpv.so.2 itself; what the runner image lacks are the system
      # libraries that mpv links against. The list is what ldd named, one by
      # one: run 42193472812 asked for libva-drm, and run 42196958763's report
      # finished the set with libXv, libva-wayland and libvdpau. Ubuntu renamed
      # some of these with the t64 transition, so each package is tried on its
      # own and a missing name is only reported.
      - name: Linux test libraries
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libx11-dev libxi-dev
          for pkg in libva-drm2 libva-x11-2 libva-wayland2 libva2 libvdpau1 libxv1 libdrm2 libgbm1 \
                     libegl1 libgl1 libasound2t64 libpulse0 libxkbcommon0 libwayland-client0 \
                     libxshmfence1 libvulkan1 libass9 libfribidi0 libharfbuzz0b liblua5.4-0 \
                     libtheora0 libvorbisfile3 libopus0; do
            sudo apt-get install -y --no-install-recommends "$pkg" || echo "no such package: $pkg"
          done

      # The gate verifies the pinned semantics patch against the SDK itself
      # (tools/flutter_sdk/prepare.py reads `git rev-parse HEAD`), so a release
      # archive will not do: the SDK is a git checkout at the revision in
      # toolchain.env, patched before any build or test runs. It goes under
      # $HOME rather than $RUNNER_TEMP, because the tests take
      # `Directory.systemTemp` as their data root and should not find a
      # multi-gigabyte SDK tree there.
      - name: Install and prepare the pinned Flutter SDK
        run: |
          set -euo pipefail
          sdk="$HOME/flutter-pinned"
          rm -rf "$sdk"
          git clone --depth 1 --branch "$FLUTTER_VERSION" \
            https://github.com/flutter/flutter.git "$sdk"
          git config --global --add safe.directory "$sdk"
          head="$(git -C "$sdk" rev-parse HEAD)"
          if [ "$head" != "$FLUTTER_REVISION" ]; then
            echo "toolchain.env pins $FLUTTER_REVISION, tag $FLUTTER_VERSION is $head" >&2
            exit 1
          fi
          python3 tools/flutter_sdk/prepare.py --apply --sdk "$sdk"
          echo "$sdk/bin" >> "$GITHUB_PATH"
          echo "FLUTTER_ROOT=$sdk" >> "$GITHUB_ENV"

      - name: Resolve packages and native bundles
        run: |
          set -euo pipefail
          flutter --version
          flutter pub get --enforce-lockfile
          bash tools/ffmpeg_kit/fetch.sh linux

      - name: Targeted tests
        run: |
          set -euo pipefail
          dart format --output=none --set-exit-if-changed apps/pure_live packages/live_store
          (cd packages/live_store && dart test test/settings_defaults_test.dart test/backup_test.dart test/stores_test.dart)
          (cd apps/pure_live && dart analyze --fatal-infos)
          (cd apps/pure_live && flutter test test/features/web_dav/ test/features/backup/ test/shared/backup_extras_test.dart test/i18n_test.dart)
          (cd apps/pure_live && flutter test test/features/live_play/live_play_layouts_test.dart test/features/live_play/room_on_phone_test.dart test/features/settings/settings_page_test.dart test/features/settings/settings_playback_test.dart)

      - name: Full gate
        run: bash tools/gate/gate.sh --all

      # Only when something failed: the native library the player tests load,
      # and exactly which of its dependencies the image still lacks.
      - name: Report unresolved native libraries
        if: failure()
        run: |
          set -euo pipefail
          so=packages/live_player/build/native_assets/linux/libmpv.so.2
          if [ -f "$so" ]; then
            ldd "$so" | grep 'not found' || echo 'every dependency of libmpv resolves'
          else
            echo "$so was never placed by the build hook"
          fi
